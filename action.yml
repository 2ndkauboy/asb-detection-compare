name: 'Antispam Bee detection comparison'
description: >-
  Replay a comment corpus through the current version-preparation branch and a
  resolved baseline release of Antispam Bee, and diff the spam/ham verdicts.
author: 'pluginkollektiv'
branding:
  icon: 'shield'
  color: 'orange'

inputs:
  php-version:
    description: 'PHP version to run the comparison on.'
    default: '8.2'
  baseline-ref:
    description: 'Explicit baseline tag/ref. When empty, it is resolved from the branch name.'
    default: ''
  branch:
    description: 'Branch name used to resolve the baseline (defaults to the triggering ref).'
    default: ''
  plugin-dir:
    description: 'Path to the Antispam Bee checkout / HEAD (defaults to the workspace).'
    default: ''
  fail-on-flips:
    description: 'Fail the job when there is at least one spam/ham flip.'
    default: 'true'
  workers:
    description: 'Parallel classifier processes.'
    default: '2'
  corpus-file:
    description: 'Path to a corpus .sql dump (defaults to the bundled fixture).'
    default: ''
  corpus-url:
    description: 'URL to download the corpus from (.sql or .sql.gz). Overrides the bundled fixture. Use a secret for release runs.'
    default: ''
  corpus-auth:
    description: 'Optional Authorization header value used when downloading corpus-url (e.g. "Bearer <token>").'
    default: ''
  db-host:
    description: 'MySQL host. Use 127.0.0.1 for a service on the runner, or the service name for a container job.'
    default: '127.0.0.1'
  db-port:
    description: 'MySQL port.'
    default: '3306'
  db-user:
    description: 'MySQL root user.'
    default: 'root'
  db-pass:
    description: 'MySQL root password.'
    default: 'root'
  wp-version:
    description: >-
      WordPress core version to install. Pin it to keep published baseline
      snapshots valid across WordPress releases; "latest" tracks the newest.
    default: 'latest'
  use-baseline-snapshot:
    description: >-
      Reuse the verdict snapshot published on the baseline release instead of
      classifying the baseline again. Falls back to classifying when there is no
      usable snapshot.
    default: 'true'
  snapshot-repo:
    description: 'Repository whose releases carry the snapshots (default: this repository).'
    default: ''
  snapshot-salt:
    description: >-
      Optional extra secret mixed into the snapshot pseudonyms. Must be identical
      for the run that publishes a snapshot and the runs that consume it.
    default: ''
  corpus-id:
    description: 'Override the computed corpus fingerprint (pins snapshot identity by hand).'
    default: ''
  corpus-label:
    description: 'Cosmetic segment in the snapshot asset name (auto: "fixture" or "private").'
    default: ''
  max-flips-listed:
    description: 'Cap on how many individual flips are listed in the report.'
    default: '50'
  lang-api:
    description: >-
      Run a local franc-based language service and compare the LangSpam rule
      against it. Without this the rule stays off, because it would otherwise
      call a public API once per eligible comment.
    default: 'false'
  lang-api-workers:
    description: >-
      Processes for that service. The classifier calls it synchronously, so this
      should match `workers`; defaults to it.
    default: ''
  options-file:
    description: >-
      Option fixture to apply to both builds. Defaults to the bundled 3.x set, or
      its LangSpam variant when `lang-api` is on.
    default: ''
  buffer-pool:
    description: >-
      InnoDB buffer pool to request from the database before classifying. The
      container default of 128 MB is far smaller than the working set and causes
      a severe slowdown part-way through a full-corpus run. Empty to leave the
      server untouched.
    default: '1G'
  github-token:
    description: 'Token used to look up the baseline snapshot on the release.'
    default: ${{ github.token }}

outputs:
  baseline:
    description: 'The baseline tag the branch was compared against.'
    value: ${{ steps.compare.outputs.baseline }}
  baseline-sha:
    description: 'The commit the baseline resolved to.'
    value: ${{ steps.compare.outputs.baseline-sha }}
  baseline-source:
    description: '"release-asset" when a published snapshot was reused, "classified" otherwise.'
    value: ${{ steps.compare.outputs.baseline-source }}
  flips:
    description: 'Number of spam/ham decision flips between baseline and HEAD.'
    value: ${{ steps.compare.outputs.flips }}
  compared:
    description: 'Number of comments present on both sides.'
    value: ${{ steps.compare.outputs.compared }}
  only-in-baseline:
    description: 'Comments classified by the baseline but not by HEAD.'
    value: ${{ steps.compare.outputs.only-in-baseline }}
  only-in-head:
    description: 'Comments classified by HEAD but not by the baseline.'
    value: ${{ steps.compare.outputs.only-in-head }}
  reason-diffs:
    description: 'Same decision, different rule — informational.'
    value: ${{ steps.compare.outputs.reason-diffs }}
  snapshot-file:
    description: >-
      Path to this run's own verdict snapshot, ready to be uploaded as an
      artifact and later attached to the release. Empty when the snapshot may not
      be published.
    value: ${{ steps.compare.outputs.snapshot-file }}
  report-markdown:
    description: >-
      Path to the comparison report rendered as Markdown, ready to post as a
      pull-request comment. Carries an `asb-detection-compare` HTML marker so a
      comment can be updated in place rather than posted again per run.
    value: ${{ steps.compare.outputs.report-markdown }}
  baseline-snapshot-file:
    description: >-
      Path to the baseline's verdict snapshot, when the baseline was a tag and had
      to be classified in this run. Attach it to that tag's release so later runs
      can reuse it. Empty when the baseline was already published or is a branch.
    value: ${{ steps.compare.outputs.baseline-snapshot-file }}

runs:
  using: 'composite'
  steps:
    - name: Set up PHP + WP-CLI
      uses: shivammathur/setup-php@v2
      with:
        php-version: ${{ inputs.php-version }}
        extensions: mysqli
        tools: composer, wp-cli
        coverage: none

    - name: Compare spam detection
      id: compare
      shell: bash
      env:
        ASB_ACTION_DIR: ${{ github.action_path }}
        ASB_PLUGIN_DIR: ${{ inputs.plugin-dir }}
        ASB_BRANCH: ${{ inputs.branch }}
        ASB_BASELINE_REF: ${{ inputs.baseline-ref }}
        FAIL_ON_FLIPS: ${{ inputs.fail-on-flips }}
        WORKERS: ${{ inputs.workers }}
        CORPUS_FILE: ${{ inputs.corpus-file }}
        CORPUS_URL: ${{ inputs.corpus-url }}
        CORPUS_AUTH: ${{ inputs.corpus-auth }}
        DB_HOST: ${{ inputs.db-host }}
        DB_PORT: ${{ inputs.db-port }}
        DB_ROOT_USER: ${{ inputs.db-user }}
        DB_ROOT_PASS: ${{ inputs.db-pass }}
        ASB_WP_VERSION: ${{ inputs.wp-version }}
        ASB_USE_BASELINE_SNAPSHOT: ${{ inputs.use-baseline-snapshot }}
        ASB_SNAPSHOT_REPO: ${{ inputs.snapshot-repo || github.repository }}
        ASB_SNAPSHOT_SALT: ${{ inputs.snapshot-salt }}
        ASB_CORPUS_ID: ${{ inputs.corpus-id }}
        ASB_CORPUS_LABEL: ${{ inputs.corpus-label }}
        ASB_MAX_FLIPS_LISTED: ${{ inputs.max-flips-listed }}
        ASB_LANG_API: ${{ inputs.lang-api }}
        ASB_LANG_API_WORKERS: ${{ inputs.lang-api-workers || inputs.workers }}
        ASB_OPTIONS_FILE: ${{ inputs.options-file }}
        ASB_BUFFER_POOL: ${{ inputs.buffer-pool }}
        GH_TOKEN: ${{ inputs.github-token }}
      run: bash "$ASB_ACTION_DIR/scripts/ci-compare.sh"