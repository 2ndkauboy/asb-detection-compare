# Example: the workflow the `pluginkollektiv/antispam-bee` repo would add as
# `.github/workflows/spam-detection-comparison.yml`.
#
# Three tiers:
#   • Pull requests            -> fast smoke check against the bundled fixture,
#                                 compared to the PR's base branch.
#   • prepare-* / release push -> thorough check against the FULL corpus dump
#                                 (decrypted in-workflow), compared to the
#                                 resolved baseline release.
#   • Manual (workflow_dispatch)-> run on ANY branch on demand, choosing the
#                                 baseline and whether to use the full corpus.
#
# Security: pull_request runs (including from forks) never receive secrets, so
# they always fall back to the bundled fixture. Only trusted events — pushes to
# prepare-* branches and manual runs — decrypt the private dump.

name: Spam-detection comparison

on:
  pull_request:
    branches: [ v3, main, master ]
  push:
    branches:
      - 'prepare-*'
      - 'chore/prepare-*'
  workflow_dispatch:
    inputs:
      baseline_ref:
        description: 'Baseline tag or branch to compare the current branch against.'
        required: true
        default: 'v3'
      corpus:
        description: 'Which corpus to classify.'
        type: choice
        options: [ full, small, fixture ]
        default: small
      fail_on_flips:
        description: 'Fail the run if any spam/ham verdict flips.'
        type: boolean
        default: true
      comment_pr:
        description: 'Post the full-corpus result as a comment on this PR number (optional).'
        required: false
        default: ''
      lang_api:
        description: >-
          Also compare the language rule, using a local franc service instead of
          the public API. Off by default: it adds ~205k local requests per build.
        type: boolean
        default: false
      workers:
        description: 'Parallel classifier processes (the language service matches this).'
        required: false
        default: '4'
      buffer_pool:
        description: 'InnoDB buffer pool to request. Below ~1G a full-corpus run slows down badly.'
        required: false
        default: '1G'

jobs:
  compare:
    runs-on: ubuntu-latest
    permissions:
      contents: read        # look up the baseline snapshot on the release
      pull-requests: write  # post the full-corpus result on a PR (manual runs)
    env:
      # Which corpus this run uses.
      #
      #   full     ~333k comments, authoritative, ~32 min per pass
      #   small    ~10k stratified, ~25 s per pass — every comment where a
      #            content rule can still run, plus a little honeypot-caught spam
      #   fixture  the action's bundled 122-row sample; no secrets needed
      #
      # Forks never get secrets, so they always fall back to the fixture. Pushes
      # to prepare-* use the full corpus; pull requests from this repo use the
      # small one; manual runs choose. Falls back to the fixture whenever the
      # corresponding URL is not configured.
      ASB_CORPUS: >-
        ${{ github.event.pull_request.head.repo.fork && 'fixture'
         || (github.event_name == 'workflow_dispatch' && inputs.corpus)
         || (github.event_name == 'push' && 'full')
         || (github.event_name == 'pull_request' && 'small')
         || 'fixture' }}
    services:
      mysql:
        image: mariadb:10.6
        env:
          MARIADB_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0        # full history/tags for baseline resolution

      # Download the encrypted corpus (public ciphertext, useless without the key)
      # and decrypt it. Both corpora carry real comment content, including real
      # ham, which is exactly why they are encrypted and never committed.
      #
      # Sets ASB_CORPUS_READY so a missing URL degrades to the bundled fixture
      # instead of failing the run.
      - name: Fetch & decrypt the corpus
        if: env.ASB_CORPUS != 'fixture'
        env:
          ASB_CORPUS_KEY: ${{ secrets.ASB_CORPUS_KEY }}
          ENC_URL: >-
            ${{ env.ASB_CORPUS == 'full' && vars.ASB_CORPUS_ENC_URL
             || vars.ASB_CORPUS_SMALL_ENC_URL }}
        run: |
          set -euo pipefail
          if [ -z "${ENC_URL:-}" ] || [ -z "${ASB_CORPUS_KEY:-}" ]; then
            echo "::notice::No '${{ env.ASB_CORPUS }}' corpus configured; using the bundled fixture."
            echo "ASB_CORPUS_READY=false" >> "$GITHUB_ENV"
            exit 0
          fi
          curl -fSL --retry 3 -o corpus.sql.gz.gpg "$ENC_URL"
          gpg --batch --quiet --yes --passphrase "$ASB_CORPUS_KEY" \
            -o corpus.sql.gz -d corpus.sql.gz.gpg
          echo "ASB_CORPUS_READY=true" >> "$GITHUB_ENV"

      - name: Compare spam detection
        id: compare
        # Published at 2ndkauboy/asb-detection-compare for now; change to
        # pluginkollektiv/asb-detection-compare if it is transferred to the org.
        uses: 2ndkauboy/asb-detection-compare@v1
        with:
          # PR -> the PR's base branch. Manual -> the chosen baseline. Prepare
          # push -> empty, so the baseline is resolved from the branch name.
          baseline-ref: ${{ (github.event_name == 'pull_request' && github.base_ref) || (github.event_name == 'workflow_dispatch' && inputs.baseline_ref) || '' }}
          # The decrypted corpus when one was fetched, else the bundled fixture.
          corpus-file: ${{ env.ASB_CORPUS_READY == 'true' && format('{0}/corpus.sql.gz', github.workspace) || '' }}
          # Names the snapshot asset, e.g. asb-snapshot-small-4eb1dc68.tsv.gz.
          # Each corpus has its own fingerprint, so their snapshots never collide
          # and a run only ever finds the baseline matching its own corpus.
          corpus-label: ${{ env.ASB_CORPUS_READY == 'true' && env.ASB_CORPUS || 'fixture' }}
          # Manual runs can opt out of failing on flips; everything else gates.
          fail-on-flips: ${{ (github.event_name == 'workflow_dispatch' && inputs.fail_on_flips == false) && 'false' || 'true' }}
          # Pinning WordPress keeps published snapshots valid across core
          # releases; bump it deliberately (it invalidates every snapshot).
          wp-version: '6.8.2'
          # Manual runs can tune these; every other event takes the defaults.
          workers: ${{ (github.event_name == 'workflow_dispatch' && inputs.workers) || '4' }}
          buffer-pool: ${{ (github.event_name == 'workflow_dispatch' && inputs.buffer_pool) || '1G' }}
          # Off unless a manual run asks for it. Enabling it switches to the
          # option fixture that turns the language rule on, which is a different
          # experiment — such a run's snapshots are fingerprinted separately and
          # will not be reused by (or reusable for) ordinary runs.
          lang-api: ${{ (github.event_name == 'workflow_dispatch' && inputs.lang_api) && 'true' || 'false' }}

      # Keep this run's verdict snapshot. When this version is released,
      # attach-snapshot-on-release.yml attaches it to the release, and the next
      # comparison against that release reuses it instead of classifying twice.
      # Fixture snapshots are not worth keeping — cheap to recompute, and they
      # would shadow a real one.
      #
      # The corpus label is part of the artifact name: with two corpora in play,
      # a single fixed name would let the release workflow attach the wrong
      # corpus's snapshot to a release.
      - name: Upload the verdict snapshot
        if: env.ASB_CORPUS_READY == 'true' && steps.compare.outputs.snapshot-file != ''
        uses: actions/upload-artifact@v4
        with:
          name: asb-detection-snapshot-${{ env.ASB_CORPUS }}
          path: ${{ steps.compare.outputs.snapshot-file }}
          retention-days: 90
          if-no-files-found: error

      # When the baseline had to be classified, its verdicts are just as
      # publishable — they describe a released tag. Attach this one to that
      # release and the next comparison against it becomes single-pass.
      - name: Upload the baseline verdict snapshot
        if: env.ASB_CORPUS_READY == 'true' && steps.compare.outputs.baseline-snapshot-file != ''
        uses: actions/upload-artifact@v4
        with:
          name: asb-detection-baseline-snapshot-${{ env.ASB_CORPUS }}
          path: ${{ steps.compare.outputs.baseline-snapshot-file }}
          retention-days: 90
          if-no-files-found: error

      # Post the result on a PR. Skipped for fixture runs, which compare 112
      # synthetic comments and would report almost nothing. Updates its own
      # comment in place instead of adding one per run.
      #
      # `always()` so a failing check (flips found) still reports: that is exactly
      # the case someone needs the table for.
      - name: Comment the result on the PR
        if: always() && env.ASB_CORPUS_READY == 'true' && inputs.comment_pr != '' && steps.compare.outputs.report-markdown != ''
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ inputs.comment_pr }}
          REPORT: ${{ steps.compare.outputs.report-markdown }}
        run: |
          set -euo pipefail

          # Fork PRs get a read-only token and cannot be commented on. Say so
          # rather than failing the run with an opaque 403.
          is_fork="$(gh pr view "$PR" --json isCrossRepository --jq .isCrossRepository)"
          if [ "$is_fork" = "true" ]; then
            echo "::notice::PR #$PR comes from a fork; skipping the comment (see the job summary instead)."
            exit 0
          fi

          # Reuse our own previous comment when there is one.
          existing="$(gh api "repos/${{ github.repository }}/issues/$PR/comments" --paginate \
            --jq 'map(select(.body | contains("<!-- asb-detection-compare -->"))) | last | .id // empty')"

          if [ -n "$existing" ]; then
            gh api --method PATCH "repos/${{ github.repository }}/issues/comments/$existing" \
              -F body=@"$REPORT" >/dev/null
            echo "Updated comment $existing on PR #$PR."
          else
            gh pr comment "$PR" --body-file "$REPORT"
            echo "Posted a new comment on PR #$PR."
          fi
